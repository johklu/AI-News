name: Newsletter erstellen und veröffentlichen

on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC = 06:17 Uhr (Winter) / 07:17 Uhr (Sommer) in Berlin
  workflow_dispatch:        # manuell starten: Actions → "Newsletter …" → Run workflow
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Neue Ausgabe erstellen
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -r requirements.txt
          python scripts/build_newsletter.py

      - name: Ausgabe speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "AI-News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Ausgabe $(TZ=Europe/Berlin date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
