name: Newsletter erstellen und veröffentlichen

# Ablauf:
#  1. Die geplante Claude-Code-Sitzung (06:41 Berlin) startet diesen Workflow per workflow_dispatch:
#     Meldungen sammeln -> eingang/meldungen.json, sofort Schlagzeilen-Ausgabe veröffentlichen.
#     schedule ist nur Rückfall, falls die Sitzung ausfällt (GitHub verspätet ihn oft um Stunden);
#     wurde heute schon gesammelt, tut er nichts.
#  2. Die Sitzung schreibt eingang/ausgabe.json (über das Claude-Abo) und pusht sie
#  3. push mit eingang/ausgabe.json: Ausgabe prüfen, speichern und veröffentlichen
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC = 04:17 Uhr (Winter) / 05:17 Uhr (Sommer) in Berlin
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Was ist zu tun?
        id: modus
        run: |
          heute_gesammelt=$(python -c "import json,datetime,zoneinfo as z; s=json.load(open('eingang/meldungen.json'))['stand']; b=z.ZoneInfo('Europe/Berlin'); print(int(datetime.datetime.fromisoformat(s).astimezone(b).date()==datetime.datetime.now(b).date()))" 2>/dev/null || echo 0)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$heute_gesammelt" = "1" ]; then
            # GitHub startet den Zeitplan oft Stunden zu spät; die Redaktion hat dann längst gesammelt.
            echo "schritt=nur-app" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "push" ]; then
            echo "schritt=sammeln" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD | grep -qx 'eingang/ausgabe.json'; then
            echo "schritt=claude" >> "$GITHUB_OUTPUT"
          else
            echo "schritt=nur-app" >> "$GITHUB_OUTPUT"
          fi

      - name: Meldungen sammeln
        if: steps.modus.outputs.schritt == 'sammeln'
        run: python scripts/build_newsletter.py sammeln

      - name: Ausgabe fertigstellen und speichern
        if: steps.modus.outputs.schritt != 'nur-app'
        run: |
          python scripts/build_newsletter.py fertigstellen
          git config user.name "AI-News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eingang docs/data
          git diff --cached --quiet || git commit -m "Ausgabe $(TZ=Europe/Berlin date +%F) (${{ steps.modus.outputs.schritt }})"
          git pull --rebase -q origin main
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
